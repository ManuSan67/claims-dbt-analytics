version: 2

sources:
  - name: silver
    database: claims
    schema: silver
    tables:
      - name: claim_events
      - name: policies

  - name: bronze
    database: claims
    schema: bronze
    config:
      loaded_at_field: _ingested_at
      freshness:
        warn_after: {count: 2, period: day}
        error_after: {count: 7, period: day}
    tables:
      - name: workshops
      - name: coverages
      - name: investigations
